name: RespKit quality gates
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-matrix:
    name: Core / Go 1.27.x / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: go test -count=1 ./...
      - run: go vet ./...

  core-quality:
    name: Core race and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: make race
      - run: make coverage

  framework-tests:
    name: Upstream framework runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Resolve framework dependencies
        working-directory: integrations/framework-tests
        run: go mod tidy
      - name: Test upstream frameworks
        working-directory: integrations/framework-tests
        run: go test -race -count=1 -v ./...

  pgx-mapper:
    name: Optional pgx mapper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Test pgx mapper
        working-directory: integrations/pgx
        run: go test -race -count=1 ./...

  sqlite3-mapper:
    name: Optional SQLite mapper / Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x']
        include:
          - os: ubuntu-latest
            go: '1.22.x'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test SQLite mapper and real driver
        working-directory: integrations/sqlite3
        run: go test -race -count=1 -cover ./...
      - name: Vet SQLite mapper
        working-directory: integrations/sqlite3
        run: go vet ./...
